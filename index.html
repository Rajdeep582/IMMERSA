<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="description" content="Immersa — interactive 3D human anatomy explorer built on BodyParts3D." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Immersa — 3D Anatomy</title>
    <style>#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(110% 75% at 50% 40%,#141922 0%,#0a0c0f 65%);color:#e9e6df;font-family:'Inter Tight',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;opacity:1;transition:opacity .5s cubic-bezier(.4,0,.2,1);will-change:opacity;contain:strict}#intro.done{opacity:0;pointer-events:none}#intro .ib-stage{display:flex;flex-direction:column;align-items:center;gap:18px;transform:translateZ(0);transition:transform .5s cubic-bezier(.4,0,.2,1)}#intro.done .ib-stage{transform:translateZ(0) scale(.97)}#intro .ib-mark{position:relative;width:64px;height:64px;opacity:0;animation:ibin .6s cubic-bezier(.2,.7,.1,1) forwards .05s}#intro .ib-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(217,179,96,.14);border-top-color:#d9b360;animation:ibspin 1.15s linear infinite;will-change:transform}#intro .ib-ring.r2{inset:11px;border-color:rgba(217,179,96,.1);border-bottom-color:rgba(242,213,141,.75);animation-duration:1.7s;animation-direction:reverse}#intro .ib-core{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#d9b360;box-shadow:0 0 0 4px rgba(217,179,96,.18);animation:ibpulse 1.6s ease-in-out infinite;will-change:transform,opacity}#intro .ib-word{font-size:24px;font-weight:600;letter-spacing:.42em;margin-right:-.42em;opacity:0;animation:ibin .7s cubic-bezier(.2,.7,.1,1) forwards .15s}#intro .ib-tag{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#8d939c;margin-top:-8px;opacity:0;animation:ibin .7s cubic-bezier(.2,.7,.1,1) forwards .3s}#intro .ib-prog{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:6px;opacity:0;animation:ibin .7s cubic-bezier(.2,.7,.1,1) forwards .4s}#intro .ib-bar{position:relative;width:200px;height:2px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;transform:translateZ(0)}#intro .ib-bar i{position:absolute;inset:0;background:linear-gradient(90deg,#b8924a,#f2d58d);transform-origin:0 50%;transform:scaleX(.04);transition:transform .6s cubic-bezier(.2,.7,.1,1);will-change:transform}#intro .ib-bar b{position:absolute;top:0;bottom:0;left:0;width:60px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:ibsheen 1.6s ease-in-out infinite;will-change:transform}#intro .ib-meta{display:flex;gap:10px;font-size:12px;color:#b9b7b1;min-height:16px}#intro .ib-pct{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;color:#d9b360;min-width:3.2em;text-align:right}@keyframes ibin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes ibspin{to{transform:rotate(360deg)}}@keyframes ibpulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.6}}@keyframes ibsheen{from{transform:translateX(-60px)}to{transform:translateX(200px)}}@media (prefers-reduced-motion:reduce){#intro *{animation-duration:.01s!important;animation-iteration-count:1!important}}</style>
  </head>
  <body>
    <div id="intro" role="status" aria-label="Loading Immersa"><div class="ib-stage"><div class="ib-mark" aria-hidden="true"><span class="ib-ring"></span><span class="ib-ring r2"></span><span class="ib-core"></span></div><div class="ib-word" aria-hidden="true">IMMERSA</div><div class="ib-tag">Interactive 3D human anatomy</div><div class="ib-prog"><div class="ib-bar"><i></i><b></b></div><div class="ib-meta"><span class="ib-label">Loading anatomy data</span><span class="ib-pct">0%</span></div></div></div></div>
    <script>(function(){var el=document.getElementById('intro');if(!el)return;var bar=el.querySelector('.ib-bar i'),lab=el.querySelector('.ib-label'),pct=el.querySelector('.ib-pct');var t0=performance.now(),shown=0,gone=false,lastPct=-1,lastLab='';function finish(){if(gone)return;gone=true;/* let the first real frame of the app paint under the veil, then fade (opacity only, compositor) */requestAnimationFrame(function(){requestAnimationFrame(function(){el.classList.add('done');setTimeout(function(){el.remove()},560)})});window.__intro=null}window.__intro={progress:function(f,label){f=Math.max(shown,Math.min(1,f));shown=f;bar.style.transform='scaleX('+Math.max(.04,f).toFixed(3)+')';var p=Math.round(f*100);if(p!==lastPct){lastPct=p;pct.textContent=p+'%'}if(label&&label!==lastLab){lastLab=label;lab.textContent=label}},done:function(){this.progress(1,'Ready');var wait=Math.max(0,700-(performance.now()-t0));setTimeout(finish,wait)}};})();</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
